name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly vulnerability sweep (Mondays 06:00 UTC) so govulncheck catches
    # newly-disclosed CVEs in pinned deps even without a code change.
    - cron: '0 6 * * 1'

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Verify Dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test (race + coverage)
      run: go test -race -coverprofile=cover.out ./...

    - name: Reproduce edge verdict (drift guard)
      # Regenerate the published walk-forward verdict from the committed fixture
      # and fail if it drifts. Makes "no measured out-of-sample edge (0/4, PBO=1.0)"
      # a build-enforced, reproducible result rather than a documented claim.
      run: make reproduce

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
    - name: golangci-lint
      # v9 ships a golangci-lint binary built with Go 1.25, required by our
      # go.mod. v6 shipped v1.64.x (Go 1.24) which rejects Go 1.25 modules.
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright smoke tests
      run: npm run test:e2e

  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
    - name: Install govulncheck
      # PINNED, not @latest. setup-go sets GOTOOLCHAIN=local, so `go install`
      # cannot pull a newer toolchain: when x/vuln v1.8.0 raised its floor to
      # go >= 1.26.0 this step began failing outright ("requires go >= 1.26.0
      # (running go 1.25.14; GOTOOLCHAIN=local)") before the scan even ran.
      # v1.7.0 declares go 1.25.0 and matches the go-version above.
      #
      # Pinning the binary does NOT stale the advisories: govulncheck fetches
      # the vulnerability database at runtime, so coverage stays current. Raise
      # this pin together with go-version, not on its own.
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
    - name: Run govulncheck
      run: govulncheck ./...
